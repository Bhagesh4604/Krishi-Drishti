services:
  # 1. Main FastAPI Backend
  - type: web
    name: krishi-drishti-api
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PORT
        value: "10000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./krishi_drishti.db
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: USE_LOCAL_DISEASE_MODEL
        value: "true"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "3"
      - key: DISEASE_INFERENCE_TIMEOUT_SECONDS
        value: "12.0"
      - key: GEMINI_INFERENCE_TIMEOUT_SECONDS
        value: "10.0"
      - key: CORS_ORIGINS
        value: "*"
