
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>Krishi-Drishti</title>
    <!-- Tailwind is compiled locally by Vite (see tailwind.config.js + index.css).
         The old CDN script (~400KB, blocking) was removed — it was a major cause
         of slow initial load and caused a flash of unstyled content. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Outfit', 'Inter', sans-serif;
        background-color: #052e16;
        -webkit-tap-highlight-color: transparent;
      }
      /* Custom scrollbar for a clean mobile look */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
      /* Instant splash while JS bundle downloads — no white flash */
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: linear-gradient(160deg, #052e16 0%, #064e3b 50%, #022c22 100%);
        transition: opacity .4s ease;
      }
      #boot-splash.done { opacity: 0; pointer-events: none; }
      #boot-splash .ring {
        width: 56px; height: 56px; border-radius: 50%;
        border: 5px solid rgba(74,222,128,.25); border-top-color: #4ade80;
        animation: bootspin 0.9s linear infinite;
      }
      #boot-splash .name { color: #dcfce7; font-weight: 800; letter-spacing: 2px; font-size: 14px; text-transform: uppercase; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>

<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="ring"></div>
        <div class="name">Krishi-Drishti</div>
      </div>
    </div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
